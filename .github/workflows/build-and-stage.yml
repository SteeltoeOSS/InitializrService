name: Build and stage

on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  build:
    name: Build and publish app
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      ASPNETCORE_ENVIRONMENT: Staging
    runs-on: ubuntu-latest
    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.*

    - name: Git checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Restore packages
      run: dotnet restore --verbosity minimal

    - name: Build solution
      run: dotnet build --no-restore --configuration Release /p:TreatWarningsAsErrors=True

    - name: Test
      run: dotnet test --no-build --configuration Release --logger trx --results-directory ${{ github.workspace }}/TestOutput

    - name: dotnet publish
      run: dotnet publish src/InitializrService/Steeltoe.InitializrService.csproj -o publish

    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v7
      with:
        name: published-app
        path: publish

  deploy:
    name: Deploy
    if: ${{ github.secret_source == 'Actions' }}
    environment:
      name: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || vars.STAGING_SLOT_NAME }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    env:
      SLOT_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || vars.STAGING_SLOT_NAME }}
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v8
      with:
        name: published-app

    - name: Login to Azure
      uses: azure/login@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: If PR, create a new staging slot
      if: ${{ github.event_name == 'pull_request' }}
      run: az webapp deployment slot create --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} --name ${{ vars.AZURE_WEBAPP_NAME}} --slot ${{ env.SLOT_NAME }} --configuration-source ${{ vars.STAGING_SLOT_NAME }}

    - name: Deploy to staging slot
      id: deploy-to-webapp
      if: ${{ github.secret_source == 'Actions' }}
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ vars.AZURE_WEBAPP_NAME }}
        package: '.'
        slot-name: ${{ env.SLOT_NAME }}

    - name: If PR, comment with the preview link
      if: ${{ github.event_name == 'pull_request' }}
      uses: mshick/add-pr-comment@v3
      with:
        message: |
          ## Preview link: https://${{ vars.AZURE_WEBAPP_NAME }}-${{ env.SLOT_NAME }}.azurewebsites.net/api/about

          - Your changes have been deployed to the preview site. The preview site will update as you add more commits to this branch.
          - The preview link is shareable, but will be deleted when the pull request is merged or closed.

          ### Need to pair with a custom NetCoreToolService address?

          A team member can use this az CLI command, replacing `<this-PR-number>` and `<other-pr-number>` with valid numbers:
          ```bash
          az webapp config appsettings set --resource-group steeltoe --name initializr-service --slot pr-<this-PR-number> --settings InitializrService__NetCoreToolService__Uri=https://netcoretoolservice-pr-<other-pr-number>.azurewebsites.net/api
          ```

          > *This is an automated message.*
        repo-token: ${{ secrets.GITHUB_TOKEN }}
